[package]
name = "tauri-plugin-sorai-converter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SORAI Toolkit converter as a Tauri v2 plugin (consumed by the sorai-toolkit hub)"
# Required by tauri-plugin's build script so the host app sees our permissions.
links = "tauri-plugin-sorai-converter"

[dependencies]
# protocol-asset: the host's asset protocol serves our thumbnails (host
# must enable app.security.assetProtocol with the thumbnail dir in scope).
tauri = { version = "2.12", features = ["protocol-asset"] }
percent-encoding = "2" # sorai-media:// request paths (preview.rs)
# Runs the host app's `ffmpeg` sidecar (the hub declares and bundles it).
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1" # engines.json (already in the tree via tauri)
regex = "1"
# Built-in PDF compressor (pdf_compress.rs). Defaults (chrono, rayon) unused.
lopdf = { version = "0.46", default-features = false }
# Image downsampling (Lanczos) and JPEG encode / decode for the same.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Ghostscript download (engines.rs). Same reqwest/rustls setup as
# tauri-plugin-updater, so the hub's tree gains no new TLS stack (ring needs
# a C compiler, which the hub's updater already does).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.11"
# .conda = zip (entries STORED) holding pkg-*.tar.zst.
zip = { version = "9", default-features = false }
ruzstd = "0.9" # pure-Rust zstd
tar = "0.4"
tokio = { version = "1", features = ["macros", "time"] } # cancel a stalled download

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

# Pixel loops (JPEG decode, Lanczos, zlib) are ~10x slower unoptimized; this
# keeps `cargo test` quick. Only applies when this crate is the build root.
[profile.dev.package]
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
